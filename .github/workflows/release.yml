# Pushing a tag such as v0.1.0 builds the VSIX and publishes it as a GitHub release.
# The tag must match the version in package.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Type check and lint
        run: npm run check-types && npm run lint

      - name: Integration tests
        run: xvfb-run -a npm test

      - name: Build VSIX
        run: npx vsce package --out "gbs-software-agent-${GITHUB_REF_NAME#v}.vsix"

      - name: Checksum
        run: sha256sum gbs-software-agent-*.vsix > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gbs-software-agent-*.vsix SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
